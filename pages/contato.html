<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Mapa do Conhecimento</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    
</head>
<body>
    <header class="cabecalho">
        <a href="../index.html" class="logo">Mapa do Conhecimento</a>
        
        <nav class="menu">
            <a href="../index.html">Inicio</a>
            <a href="../pages/temas.html">Temas</a>
            <a href="../pages/sobre.html">Sobre</a>
            <a href="../pages/contato.html">Contato</a>
            <button id="botao-tema" type="button">🌙</button>
        </nav>
    </header>

    <main>
        <section class="conteudo-pagina">
            <p>Início / Contato</p>
            <h1>Entre em contato</h1>
            <p>Tem uma dúvida, sugestão ou ideia para o projeto? Escreva uma mensagem.</p>

            <form class="formulario" id="form-contato">
                <!-- Nome -->
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" placeholder="Digite seu nome" required>
                
                <!-- E-mail -->
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" placeholder="voce@exemplo.com" required>
                
                <!-- Mensagem (Trocado textarea por um input normal) -->
                <label for="mensagem">Mensagem</label>
                <input id="mensagem" name="mensagem" type="text" placeholder="Escreva sua mensagem aqui..." required>
                
                <button class="botao" type="submit">Enviar mensagem</button>
            </form>
            <br>
             <br>
              <br>
            <p>FORMULÁRIO DE TESTE!</p>
        </section>
    </main>

    <footer>Mapa do Conhecimento • Aprender pode ser simples.</footer>
    <script src="../js/script.js"></script>
</body>
</html>

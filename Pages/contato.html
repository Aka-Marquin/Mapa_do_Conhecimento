<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Mapa do Conhecimento</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/contato.css">
</head>
<body>
     <header id="header" class="header">

        <div class="teste-perfil">
            <h1><a href="./index.html">🧠Mapa do Conhecimento</a></h1>
        </div>

        <nav class="menu">
            <a href="/index.html">Inicio</a>
            <a href="../Pages/temas.html">Temas</a>
            <a href="../Pages/sobre.html">Sobre</a>
            <a href="../Pages/contato.html">Contato</a>
            <button id="botao-tema" type="button">🌙</button>
        </nav>
    </header>

    <main>
         <section id="contato" class="pagina">

        <div class="Contato-title">    
        <h3>Entre em contato</h3>
        <p>Tem uma dúvida, sugestão ou ideia para o projeto?
        Escreva uma mensagem pra gente!</p>
        </div>

        <div class="area-contato">

            <form class="formulario" onsubmit="enviarMensagem(event)">
                <label for="email">E-mail</label>
                <input type="email" id="email" required>

                <label for="nome">Nome</label>
                <input type="text" id="nome" required>

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" rows="5"
                placeholder="Escreva sua mensagem aqui..."
                required></textarea>

                <button id="botao" type="submit">📨 Enviar mensagem</button>

                <p id="aviso"></p>
            </form>

            <div class="senaco">
                <img src="../assets/imgs/contat.png">
            </div>

        </div>
    </section>
    </main>

 <!--FOOTER-->
    <footer class="footer">

    </div>
    <script src="../js/script.js"></script>
</body>
</html>
